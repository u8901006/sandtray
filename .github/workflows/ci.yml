name: contracts-and-prototype
env:
  PLAYWRIGHT_BROWSERS_PATH: '0'
  WRANGLER_SEND_METRICS: 'false'
on: [push, pull_request]
permissions:
  contents: read
# Runs on the git checkout alone. The CC0 model packs are not committed, so asset-dependent cases report
# SKIPPED/NOT_RUN, never PASS. See ASSETS.md for fetching the packs locally.
jobs:
  clean:
    runs-on: ubuntu-latest
    env:
      REQUIRE_LOCAL_ASSETS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # tests/staging-browser-probe.test.ts launches a real Chromium inside `npm run check`.
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run worker:check -- --env production
