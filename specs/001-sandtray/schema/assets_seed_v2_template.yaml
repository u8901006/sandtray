# assets_seed.yaml
# Online Sandtray 3D Asset Registry
schema_version: "2.0"

project:
  name: "online-sandtray"
  target_platform:
    - web
    - threejs
    - cloudflare
  preferred_format: glb

  asset_policy:
    preferred_licenses:
      - CC0
      - CC-BY-4.0
      - commercial_royalty_free

    reject_licenses:
      - CC-BY-NC
      - CC-BY-ND
      - editorial_only
      - non_commercial_only

    preferred_sources:
      - Quaternius
      - Kenney
      - PolyHaven
      - Sketchfab
      - Fab
      - CGTrader
      - TurboSquid
      - DAZ3D
      - Moyu

    default_performance_targets:
      max_triangles_prop: 15000
      max_triangles_character: 50000
      preferred_texture_size: 1024
      max_texture_size: 2048
      preferred_material_count: 4
      max_glb_mb: 8

    optimization:
      draco: true
      meshopt: true
      texture_format: webp
      use_ktx2_when_possible: true
      generate_lod: true


